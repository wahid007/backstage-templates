apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${{ values.componentId }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.componentId }}
    app.kubernetes.io/name: ${{ values.componentId }}
    app.kubernetes.io/instance: ${{ values.componentId }}
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ${{ values.componentId }}
    app.kubernetes.io/managed-by: argocd
    backstage.io/kubernetes-id: ${{ values.componentId }}
spec:
  podSelector:
    matchLabels:
      app: ${{ values.componentId }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow the LoadBalancer/Ingress and in-cluster clients to reach the pod.
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS egress (e.g. external APIs). Tighten to specific destinations when
    # the service no longer needs unrestricted outbound access.
    - ports:
        - protocol: TCP
          port: 443
