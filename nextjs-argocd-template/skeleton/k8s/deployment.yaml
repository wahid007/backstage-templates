apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.componentId }}
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.componentId }}
    app.kubernetes.io/name: ${{ values.componentId }}
    app.kubernetes.io/instance: ${{ values.componentId }}
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ${{ values.componentId }}
    app.kubernetes.io/managed-by: argocd
    backstage.io/kubernetes-id: ${{ values.componentId }}
spec:
  replicas: ${{ values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ${{ values.componentId }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ${{ values.componentId }}
        app.kubernetes.io/name: ${{ values.componentId }}
        app.kubernetes.io/instance: ${{ values.componentId }}
        app.kubernetes.io/component: web
        backstage.io/kubernetes-id: ${{ values.componentId }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
{% if values.imagePullSecret %}
      # GHCR packages are private: this secret must exist in the namespace
      # below, otherwise the pod stays in ImagePullBackOff.
      imagePullSecrets:
        - name: ${{ values.imagePullSecret }}
{% endif %}
      containers:
        - name: app
          # The CI/CD pipeline rewrites the tag with the commit SHA after every
          # push to main, so Argo CD always deploys an immutable image.
          image: ghcr.io/${{ values.destination.owner | lower }}/${{ values.destination.repo | lower }}:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: APP_NAME
              value: ${{ values.componentId }}
            - name: APP_VERSION
              value: "0.1.0"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
