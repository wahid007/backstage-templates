{% raw %}
name: CI/CD - Build, Scan and GitOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '24'

# Do not cancel an in-flight main build: it publishes the image and updates
# the GitOps manifest. Pull-request runs for the same ref are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint, type-check, unit tests and production build
  # ---------------------------------------------------------------------------
  lint-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json found yet - falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Run Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 2) Security scans (report-only: findings never block the pipeline)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scans
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -- Snyk (open-source dependencies) -----------------------------------
      - name: Snyk Open Source Scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

      # -- OWASP Dependency-Check (SCA report) -------------------------------
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ env.NVD_API_KEY }}
        with:
          project: ${{ github.repository }}
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: '--enableRetired'

      # -- Trivy (filesystem: dependencies, IaC and secrets) -----------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      # -- Checkov (Kubernetes manifests and Dockerfile) ---------------------
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: .
          framework: kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      # -- GitGuardian (secret scanning) -------------------------------------
      - name: GitGuardian Secret Scan
        if: env.GITGUARDIAN_API_KEY != ''
        uses: GitGuardian/ggshield-action@v1
        continue-on-error: true
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ env.GITGUARDIAN_API_KEY }}

      # -- Publish reports ---------------------------------------------------
      - name: Upload Trivy Results to the Security Tab
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload Checkov Results to the Security Tab
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3) Build/push the image, scan it, then commit the immutable tag so Argo CD
  #    can reconcile the cluster (GitOps).
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Build, Push and Update GitOps Manifest
    needs: [ lint-test, security-scan ]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Image Name
        # GHCR requires a lowercase repository name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Update Kubernetes Manifest Image Tag
        run: |
          IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"
          sed -i -E "s|^([[:space:]]*image:).*|\1 ${IMAGE}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "Manifest already points at ${IMAGE} - nothing to commit"
            exit 0
          fi

          git commit -m "chore(gitops): deploy ${GITHUB_SHA:0:7} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # ---------------------------------------------------------------------------
  # 4) Slack notification (always runs, skipped when the webhook is not set)
  # ---------------------------------------------------------------------------
  notify:
    name: Slack Notification
    needs: [ lint-test, security-scan, docker-build-push ]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Send Slack Notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*${{ github.repository }}* — `${{ github.ref_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Lint / Test / Build:* ${{ needs.lint-test.result }}\n*Security Scans:* ${{ needs.security-scan.result }}\n*Docker + GitOps:* ${{ needs.docker-build-push.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
            }
{% endraw %}
