# Standalone Argo CD Application for this service.
#
# The Backstage template also opens a pull request against the gitops-infra
# app-of-apps repository, adding the same Application as
# `apps/${{ values.componentId }}.yaml`. Apply this file manually only when you
# do not use the app-of-apps repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.componentId }}
  namespace: ${{ values.argocdNamespace }}
  labels:
    app.kubernetes.io/name: ${{ values.componentId }}
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: gitops-infra
    app.kubernetes.io/managed-by: backstage
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ${{ values.argocdProject }}
  source:
    repoURL: https://${{ values.destination.host }}/${{ values.destination.owner }}/${{ values.destination.repo }}.git
    targetRevision: ${{ values.targetRevision }}
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ${{ values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
