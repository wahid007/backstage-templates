# Location entity that registers the Next.js + Argo CD GitOps template.
#
# Add this file (or template.yaml directly) as a Location in Backstage, or add
# ./nextjs-argocd-template/template.yaml to the root catalog-info.yaml targets.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: nextjs-argocd-template
  title: Next.js + Argo CD GitOps Template
  description: Next.js service with CI/CD security scans and Argo CD app-of-apps onboarding
  tags:
    - templates
    - nextjs
    - argocd
    - gitops
spec:
  targets:
    - ./template.yaml
