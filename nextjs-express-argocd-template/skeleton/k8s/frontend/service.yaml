apiVersion: v1
kind: Service
metadata:
  name: ${{ values.componentId }}-frontend-svc
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.componentId }}-frontend
    app.kubernetes.io/name: ${{ values.componentId }}-frontend
    app.kubernetes.io/instance: ${{ values.componentId }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ${{ values.componentId }}
    app.kubernetes.io/managed-by: argocd
    backstage.io/kubernetes-id: ${{ values.componentId }}
spec:
  # LoadBalancer exposes the frontend through the cloud provider / MetalLB.
  # Switch to ClusterIP when an Ingress or Gateway handles external traffic.
  type: LoadBalancer
  selector:
    app: ${{ values.componentId }}-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None
