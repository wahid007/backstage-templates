apiVersion: v1
kind: Service
metadata:
  name: ${{ values.componentId }}-backend-svc
  namespace: ${{ values.namespace }}
  labels:
    app: ${{ values.componentId }}-backend
    app.kubernetes.io/name: ${{ values.componentId }}-backend
    app.kubernetes.io/instance: ${{ values.componentId }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ${{ values.componentId }}
    app.kubernetes.io/managed-by: argocd
    backstage.io/kubernetes-id: ${{ values.componentId }}
spec:
  # Internal only: the Next.js frontend reaches the API through this Service.
  type: ClusterIP
  selector:
    app: ${{ values.componentId }}-backend
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
  sessionAffinity: None
